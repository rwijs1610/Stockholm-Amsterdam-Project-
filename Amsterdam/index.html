<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="customer-service" id="customer-service" aria-label="Open customer service">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.71,10.71Q9,10.43 9,10Q9,9.57 8.71,9.29T8,9Q7.58,9 7.29,9.29T7,10t0.29,0.71T8,11t0.71-0.29Zm4,0Q13,10.43 13,10q0-0.43-0.29-0.71T12,9T11.29,9.29T11,10t0.29,0.71T12,11t0.71-0.29Zm4,0Q17,10.43 17,10q0-0.43-0.29-0.71T16,9T15.29,9.29T15,10t0.29,0.71T16,11q0.43,0 0.71-0.29ZM2,22V4Q2,3.17 2.59,2.59T4,2H20q0.83,0 1.41,0.59T22,4V16q0,0.82-0.59,1.41T20,18H6L2,22Zm3.15-6H20V4H4V17.13L5.15,16ZM4,16V4V16Z"/></svg>
    </button>

    <div class="dropdown hidden" id="dropdown">

        <div class="dropdown-header">
            <div>
                <h2>Customer service</h2>
                <p>We usually reply within a day</p>
            </div>
            <button class="close-btn" id="close-btn" aria-label="Close">&times;</button>
        </div>

        <div class="messages" id="messages">
            <div class="message bot">Hi! How can we help you?</div>
        </div>

        <div class="quick-buttons">
            <button class="quick-btn" data-question="How do I download a game?">Download a game</button>
            <button class="quick-btn" data-question="I can't find my post">My post</button>
            <button class="quick-btn" data-question="I want to report a bug">Report a bug</button>
        </div>

        <form class="input-row" id="message-form">
            <input type="text" id="message-input" placeholder="Write a message..." autocomplete="off">
            <button type="submit" class="send-btn" aria-label="Send">&#10148;</button>
        </form>

    </div>

    <script src="index.js"></script>
</body>
</html>
